[package]
name = "tuff_virtual_machine"
version = "0.1.1"
edition = "2024"

[dependencies]
cpal = "0.18.1"
minifb = "0.28.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processenv", "winbase", "fileapi", "winnt", "handleapi"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
opt-level = "z"
